<svg xmlns="http://www.w3.org/2000/svg" width="864" height="832" viewBox="0 0 864 832" role="img" aria-labelledby="title description">
  <title id="title">Reduction in accuracy drop across rarity dimensions</title>
  <desc id="description">Horizontal bar chart of the robustness gap between Cultural Pangea and our system. Positive values mean our system loses less accuracy. Fourteen of fifteen gaps are positive. Entity age is the only negative gap.</desc>
  <rect width="864" height="832" fill="#ffffff"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#202124">
    <text x="432" y="42" text-anchor="middle" font-size="27" font-weight="600">Reduction in accuracy drop</text>
    <text x="432" y="73" text-anchor="middle" font-size="18" fill="#5f6368">Pangea drop − ours (percentage points)</text>

    <g stroke="#e1e5e8" stroke-width="1">
      <line x1="300" y1="91" x2="300" y2="720"/>
      <line x1="453" y1="91" x2="453" y2="720"/>
      <line x1="555" y1="91" x2="555" y2="720"/>
      <line x1="657" y1="91" x2="657" y2="720"/>
      <line x1="759" y1="91" x2="759" y2="720"/>
    </g>
    <line x1="351" y1="87" x2="351" y2="724" stroke="#60666b" stroke-width="2"/>

    <g font-size="19" text-anchor="end">
      <text x="286" y="119">Qualifiers</text>
      <text x="286" y="159">Statements</text>
      <text x="286" y="199">WD outgoing links</text>
      <text x="286" y="239">Categories</text>
      <text x="286" y="279">Language editions</text>
      <text x="286" y="319">External links</text>
      <text x="286" y="359">Pageviews</text>
      <text x="286" y="399">Article size</text>
      <text x="286" y="439">Editors</text>
      <text x="286" y="479">References</text>
      <text x="286" y="519">Revisions</text>
      <text x="286" y="559">WD incoming links</text>
      <text x="286" y="599">WP backlinks</text>
      <text x="286" y="639">Images</text>
      <text x="286" y="679">Entity age</text>
    </g>

    <g fill="#9bc9dc" stroke="#5b95ad" stroke-width="1">
      <rect x="351" y="99" width="418" height="26" rx="5"/>
      <rect x="351" y="139" width="388" height="26" rx="5"/>
      <rect x="351" y="179" width="377" height="26" rx="5"/>
      <rect x="351" y="219" width="291" height="26" rx="5"/>
      <rect x="351" y="259" width="240" height="26" rx="5"/>
      <rect x="351" y="299" width="191" height="26" rx="5"/>
      <rect x="351" y="339" width="186" height="26" rx="5"/>
      <rect x="351" y="379" width="181" height="26" rx="5"/>
      <rect x="351" y="419" width="176" height="26" rx="5"/>
      <rect x="351" y="459" width="163" height="26" rx="5"/>
      <rect x="351" y="499" width="145" height="26" rx="5"/>
      <rect x="351" y="539" width="120" height="26" rx="5"/>
      <rect x="351" y="579" width="61" height="26" rx="5"/>
      <rect x="351" y="619" width="18" height="26" rx="5"/>
    </g>
    <rect x="315" y="659" width="36" height="26" rx="5" fill="#f2b886" stroke="#c77b42" stroke-width="1"/>

    <g font-size="18" font-weight="600">
      <text x="778" y="119">+16.4</text>
      <text x="748" y="159">+15.2</text>
      <text x="737" y="199">+14.8</text>
      <text x="651" y="239">+11.4</text>
      <text x="600" y="279">+9.4</text>
      <text x="551" y="319">+7.5</text>
      <text x="546" y="359">+7.3</text>
      <text x="541" y="399">+7.1</text>
      <text x="536" y="439">+6.9</text>
      <text x="523" y="479">+6.4</text>
      <text x="505" y="519">+5.7</text>
      <text x="480" y="559">+4.7</text>
      <text x="421" y="599">+2.4</text>
      <text x="378" y="639">+0.7</text>
      <text x="333" y="679" text-anchor="middle" fill="#7d431f" font-size="16">−1.4</text>
    </g>

    <line x1="300" y1="720" x2="810" y2="720" stroke="#60666b" stroke-width="1.5"/>
    <g font-size="17" fill="#555b60" text-anchor="middle">
      <text x="300" y="747">−2</text>
      <text x="351" y="747">0</text>
      <text x="453" y="747">4</text>
      <text x="555" y="747">8</text>
